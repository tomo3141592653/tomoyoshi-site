<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Reflections Timeline | 朋義の月記</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #141828 0%, #1a2138 50%, #232c4e 100%);
            min-height: 100vh;
            color: #e8e8e8;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #c9d2ff, #8fa0ff, #8fa0ff, #6e82e8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 1.1rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #8fa0ff;
        }

        .stat-label {
            color: #888;
            font-size: 0.9rem;
        }

        /* Year Slider */
        .year-slider-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(20, 24, 40, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 0 0 16px 16px;
            padding: 30px;
            margin: 0 0 30px 0;
            border-bottom: 1px solid rgba(143, 160, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .year-slider-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .year-display {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(90deg, #8fa0ff, #6e82e8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .year-label {
            color: #888;
            font-size: 0.9rem;
        }

        .controller-toggle {
            display: none;
            width: 100%;
            min-height: 44px;
            margin-top: 16px;
            border: 1px solid rgba(143, 160, 255, 0.35);
            border-radius: 8px;
            background: rgba(143, 160, 255, 0.12);
            color: #e8e8e8;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .controller-body {
            display: block;
        }

        .year-slider-wrapper {
            position: relative;
            margin: 20px 0;
        }

        .year-slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .year-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #8fa0ff;
            cursor: pointer;
            border: 3px solid #141828;
            box-shadow: 0 0 10px rgba(143, 160, 255, 0.5);
            transition: all 0.3s;
        }

        .year-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(143, 160, 255, 0.8);
        }

        .year-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #8fa0ff;
            cursor: pointer;
            border: 3px solid #141828;
            box-shadow: 0 0 10px rgba(143, 160, 255, 0.5);
            transition: all 0.3s;
        }

        .year-slider::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(143, 160, 255, 0.8);
        }

        .year-range-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            color: #888;
            font-size: 0.85rem;
        }

        .date-jump {
            display: grid;
            grid-template-columns: minmax(120px, 180px) 1fr;
            gap: 16px;
            align-items: start;
            margin-top: 22px;
        }

        .year-select {
            width: 100%;
            min-height: 44px;
            border: 1px solid rgba(143, 160, 255, 0.35);
            border-radius: 8px;
            background: rgba(15, 52, 96, 0.9);
            color: #e8e8e8;
            font-size: 1rem;
            padding: 0 14px;
            outline: none;
        }

        .year-select:focus {
            border-color: #8fa0ff;
            box-shadow: 0 0 0 3px rgba(143, 160, 255, 0.18);
        }

        .month-buttons {
            display: grid;
            grid-template-columns: repeat(12, minmax(44px, 1fr));
            gap: 8px;
        }

        .month-button {
            min-height: 44px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            color: #ddd;
            font-size: 0.95rem;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, color 0.2s;
        }

        .month-button:hover:not(:disabled),
        .month-button.active {
            border-color: #8fa0ff;
            background: rgba(143, 160, 255, 0.18);
            color: #fff;
        }

        .month-button:disabled {
            color: rgba(255, 255, 255, 0.22);
            cursor: default;
            background: rgba(255, 255, 255, 0.03);
        }

        /* Timeline */
        .timeline {
            position: relative;
            padding: 20px 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 30px;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, #8fa0ff, #6e82e8, #c9d2ff, #8fa0ff);
            border-radius: 2px;
        }

        .timeline-item {
            display: flex;
            align-items: flex-start;
            margin: 30px 0;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s forwards;
            position: relative;
        }

        .timeline-dot {
            position: absolute;
            left: 30px;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #8fa0ff;
            border: 4px solid #141828;
            z-index: 1;
            transition: all 0.3s;
        }

        .timeline-dot:hover {
            transform: translateX(-50%) scale(1.3);
            box-shadow: 0 0 20px rgba(143, 160, 255, 0.6);
        }

        .timeline-content {
            flex: 1;
            max-width: 900px;
            margin-left: 70px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .timeline-content:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(143, 160, 255, 0.3);
            transform: translateY(-3px);
        }

        .timeline-date {
            font-size: 1.2rem;
            font-weight: bold;
            color: #8fa0ff;
            margin-bottom: 8px;
        }

        .timeline-age {
            font-size: 0.85rem;
            color: #c9d2ff;
            margin-bottom: 10px;
        }

        .timeline-content-full {
            color: #ddd;
            line-height: 2;
            font-size: 1rem;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tweet-count {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #999;
            text-decoration: none;
            transition: color 0.2s;
        }

        .tweet-count:hover {
            color: #8fa0ff;
        }


        /* Age color coding */
        .age-20s {
            --age-color: #8fa0ff;
        }

        .age-30s {
            --age-color: #6e82e8;
        }

        .age-40s {
            --age-color: #c9d2ff;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .year-slider-container {
                padding: 20px;
            }

            .year-display {
                font-size: 2rem;
            }

            .controller-toggle {
                display: block;
            }

            .year-slider-container.collapsed {
                padding-bottom: 16px;
            }

            .year-slider-container.collapsed .controller-body {
                display: none;
            }

            .date-jump {
                grid-template-columns: 1fr;
            }

            .month-buttons {
                grid-template-columns: repeat(4, 1fr);
            }

            .timeline::before {
                left: 20px;
            }

            .timeline-item {
                flex-direction: column;
            }

            .timeline-dot {
                left: 20px;
            }

            .timeline-content {
                max-width: 100%;
                margin-left: 50px !important;
                margin-right: 0 !important;
            }

            .stats {
                gap: 20px;
            }

            .stat-value {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body><div style="font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.18em;padding:14px 24px"><a href="../index.html" style="color:inherit;text-decoration:none">&larr; 平田朋義 HOME</a></div>
    <div class="container">
        <header>
            <h1>Monthly Reflections Timeline</h1>
            <p class="subtitle">朋義の月記 2002-2026</p>
        </header>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="total-months">0</div>
                <div class="stat-label">月記</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="total-years">0</div>
                <div class="stat-label">年間</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="total-chars">0</div>
                <div class="stat-label">文字</div>
            </div>
        </div>

        <div class="year-slider-container">
            <div class="year-slider-header">
                <div class="year-display" id="month-display">2002-04</div>
                <div class="year-label">月を選択してスクロール</div>
                <button type="button" class="controller-toggle" id="controller-toggle" aria-expanded="true">
                    コントローラーを隠す
                </button>
            </div>
            <div class="controller-body" id="controller-body">
                <div class="year-slider-wrapper">
                    <input type="range" class="year-slider" id="month-slider" min="0" max="0" value="0" step="1">
                    <div class="year-range-labels">
                        <span id="min-month">2002-04</span>
                        <span id="max-month">2026-04</span>
                    </div>
                </div>
                <div class="date-jump" aria-label="年月を直接選択">
                    <select class="year-select" id="year-select" aria-label="年を選択"></select>
                    <div class="month-buttons" id="month-buttons" aria-label="月を選択"></div>
                </div>
            </div>
        </div>

        <div class="timeline" id="timeline"></div>
    </div>


    <script>
        let reflections = {};
        let sortedKeys = [];
        let filteredKeys = [];
        let currentIndex = 0;
        let selectedYear = 'all';
        let monthElements = {}; // 月記エントリのDOM要素を保持

        // Calculate age from year-month
        function getAge(yearMonth) {
            const [year, month] = yearMonth.split('-').map(Number);
            // Born April 23, 1980
            let age = year - 1980;
            // Before April = still previous age
            if (month < 4) {
                age--;
            }
            return age;
        }

        function getAgeClass(age) {
            if (age < 30) return 'age-20s';
            if (age < 40) return 'age-30s';
            return 'age-40s';
        }

        function formatYearMonth(yearMonth) {
            const [year, month] = yearMonth.split('-');
            const monthNames = ['', '1月', '2月', '3月', '4月', '5月', '6月',
                '7月', '8月', '9月', '10月', '11月', '12月'];
            return `${year}年${monthNames[parseInt(month)]}`;
        }

        function loadData() {
            fetch('data/monthly-reflections.json')
                .then(r => {
                    if (!r.ok) throw new Error('Not found');
                    return r.json();
                })
                .then(data => {
                    reflections = data;
                    sortedKeys = Object.keys(data).sort();
                    initApp();
                })
                .catch(err => {
                    document.getElementById('timeline').innerHTML =
                        '<p style="text-align:center;color:#8fa0ff;padding:40px;">データを読み込めませんでした</p>';
                });
        }

        function initApp() {
            updateStats();
            renderTimeline();
            initYearSlider(); // renderTimelineの後に実行（DOM要素が必要）
            initControllerToggle();
        }

        function updateStats() {
            document.getElementById('total-months').textContent = sortedKeys.length;

            const years = new Set(sortedKeys.map(k => k.split('-')[0]));
            document.getElementById('total-years').textContent = years.size;

            let totalChars = 0;
            sortedKeys.forEach(k => {
                totalChars += (reflections[k].reflection || '').length;
            });
            document.getElementById('total-chars').textContent =
                totalChars > 10000 ? Math.round(totalChars / 1000) + 'K' : totalChars;
        }

        function initYearSlider() {
            const slider = document.getElementById('month-slider');
            const display = document.getElementById('month-display');
            const minMonthLabel = document.getElementById('min-month');
            const maxMonthLabel = document.getElementById('max-month');
            const yearSelect = document.getElementById('year-select');

            // 全月記を表示（フィルタしない）
            filteredKeys = sortedKeys;

            const minMonth = sortedKeys[0] || '2002-04';
            const maxMonth = sortedKeys[sortedKeys.length - 1] || '2026-04';

            slider.min = 0;
            slider.max = sortedKeys.length - 1;
            slider.value = 0; // 最初の月をデフォルト
            display.textContent = minMonth;
            minMonthLabel.textContent = minMonth;
            maxMonthLabel.textContent = maxMonth;

            const years = [...new Set(sortedKeys.map(key => key.split('-')[0]))];
            yearSelect.innerHTML = years
                .map(year => `<option value="${year}">${year}年</option>`)
                .join('');
            yearSelect.value = minMonth.split('-')[0];
            renderMonthButtons(yearSelect.value, minMonth);

            slider.addEventListener('input', (e) => {
                const index = parseInt(e.target.value);
                const monthKey = sortedKeys[index];
                selectMonth(monthKey, true);
            });

            yearSelect.addEventListener('change', (e) => {
                const year = e.target.value;
                const firstMonth = sortedKeys.find(key => key.startsWith(`${year}-`));
                renderMonthButtons(year, firstMonth);
                selectMonth(firstMonth, true);
            });
        }

        function initControllerToggle() {
            const container = document.querySelector('.year-slider-container');
            const toggle = document.getElementById('controller-toggle');
            if (!container || !toggle) return;

            const setCollapsed = (collapsed) => {
                container.classList.toggle('collapsed', collapsed);
                toggle.setAttribute('aria-expanded', String(!collapsed));
                toggle.textContent = collapsed ? 'コントローラーを表示' : 'コントローラーを隠す';
            };

            toggle.addEventListener('click', () => {
                setCollapsed(!container.classList.contains('collapsed'));
            });
        }

        function renderMonthButtons(year, activeMonth) {
            const monthButtons = document.getElementById('month-buttons');
            const existingMonths = new Set(
                sortedKeys
                    .filter(key => key.startsWith(`${year}-`))
                    .map(key => Number(key.split('-')[1]))
            );

            monthButtons.innerHTML = Array.from({ length: 12 }, (_, index) => {
                const month = index + 1;
                const key = `${year}-${String(month).padStart(2, '0')}`;
                const disabled = !existingMonths.has(month);
                const active = key === activeMonth ? ' active' : '';
                return `<button type="button" class="month-button${active}" data-month="${key}" ${disabled ? 'disabled' : ''}>${month}月</button>`;
            }).join('');

            monthButtons.querySelectorAll('.month-button:not(:disabled)').forEach(button => {
                button.addEventListener('click', () => selectMonth(button.dataset.month, true));
            });
        }

        function selectMonth(monthKey, shouldScroll) {
            if (!monthKey) return;
            const index = sortedKeys.indexOf(monthKey);
            if (index === -1) return;

            const slider = document.getElementById('month-slider');
            const display = document.getElementById('month-display');
            const yearSelect = document.getElementById('year-select');
            const selectedYear = monthKey.split('-')[0];

            slider.value = index;
            display.textContent = monthKey;

            if (yearSelect.value !== selectedYear) {
                yearSelect.value = selectedYear;
            }
            renderMonthButtons(selectedYear, monthKey);

            if (shouldScroll) {
                scrollToMonth(monthKey);
            }
        }

        function scrollToMonth(monthKey) {
            const element = monthElements[monthKey];
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function renderTimeline() {
            const timeline = document.getElementById('timeline');
            // 全月記を表示（フィルタしない）
            filteredKeys = sortedKeys;
            monthElements = {}; // リセット

            let html = '';
            filteredKeys.forEach((key, idx) => {
                const entry = reflections[key];
                const age = getAge(key);
                const ageClass = getAgeClass(age);
                const fullText = entry.reflection || '';
                // HTMLエスケープ + 改行を<br>に変換
                const escapedText = fullText
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;')
                    .replace(/\n/g, '<br>');

                html += `
                    <div class="timeline-item ${ageClass}" id="month-${key}" style="animation-delay: ${idx * 0.05}s">
                        <div class="timeline-dot" style="background: var(--age-color)"></div>
                        <div class="timeline-content">
                            <div class="timeline-date">${formatYearMonth(key)}</div>
                            <div class="timeline-age">${age}歳</div>
                            <div class="timeline-content-full">${escapedText}</div>
                            ${entry.tweet_count ? `<a href="unified-diary.html?year=${key.split('-')[0]}&month=${key.split('-')[1]}" class="tweet-count">📝 ${entry.tweet_count} 件</a>` : ''}
                        </div>
                    </div>
                `;
            });

            timeline.innerHTML = html;

            // DOM要素を保持（スクロール用）
            filteredKeys.forEach(key => {
                const element = document.getElementById(`month-${key}`);
                if (element) {
                    monthElements[key] = element;
                }
            });
        }


        // Load data on page load
        loadData();
    </script>
</body>

</html>
