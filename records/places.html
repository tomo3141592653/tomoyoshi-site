<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訪れた場所の記録 - Visited Places Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
            background: #141828;
            color: white;
        }

        header {
            background: linear-gradient(135deg, #3549c9 0%, #232c4e 100%);
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .description {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            opacity: 0.8;
            line-height: 1.8;
        }

        #map {
            width: 100%;
            height: calc(100vh - 200px);
            min-height: 600px;
        }

        .stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
            min-width: 200px;
        }

        .stat-item {
            margin-bottom: 15px;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #3549c9;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .stats {
                top: 10px;
                right: 10px;
                padding: 15px;
                min-width: 150px;
            }

            .stat-number {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body><div style="font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.18em;padding:14px 24px"><a href="../index.html" style="color:inherit;text-decoration:none">&larr; 平田朋義 HOME</a></div>
    <header>
        <h1>訪れた場所の記録</h1>
        <p class="subtitle">2014年〜現在までのGPS記録</p>
    </header>

    <div class="description">
        <p>朋義さんが訪れた場所を記録したGPSデータの可視化。約100万ポイントから抽出したユニークな位置情報をマップ上に表示しています。</p>
    </div>

    <div id="map"></div>

    <div class="stats">
        <div class="stat-item">
            <div class="stat-number" id="pointCount">-</div>
            <div class="stat-label">記録地点数</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="loading">読込中...</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // マップの初期化（東京を中心に）
        const map = L.map('map', {
            center: [35.6762, 139.6503],
            zoom: 5,
            zoomControl: true
        });

        // タイルレイヤーの追加（ダークモード）
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        let allPoints = [];
        let markers = [];

        async function loadData() {
            try {
                document.getElementById('loading').textContent = '読込中...';

                // 元のリポジトリから直接ロード（ファイルサイズ対策）
                const response = await fetch('https://raw.githubusercontent.com/tomo3141592653/location_log/main/unique_location.json');
                allPoints = await response.json();

                document.getElementById('pointCount').textContent = allPoints.length.toLocaleString();
                document.getElementById('loading').textContent = '✓ 完了';

                // ポイントをマーカーで表示（数が多すぎる場合は間引く）
                const displayLimit = 5000;  // 表示する最大ポイント数
                const skipFactor = Math.ceil(allPoints.length / displayLimit);

                console.log(`Total points: ${allPoints.length}, Display: ${Math.min(allPoints.length, displayLimit)}, Skip factor: ${skipFactor}`);

                let displayedCount = 0;
                for (let i = 0; i < allPoints.length; i += skipFactor) {
                    const [lat, lng] = allPoints[i];

                    // シンプルなサークルマーカー
                    const marker = L.circleMarker([lat, lng], {
                        radius: 2,
                        fillColor: '#3549c9',
                        color: '#ffffff',
                        weight: 0.5,
                        opacity: 0.6,
                        fillOpacity: 0.4
                    });

                    marker.addTo(map);
                    markers.push(marker);
                    displayedCount++;
                }

                console.log(`Displayed ${displayedCount} markers`);

                // 全ポイントを含む範囲にフィット
                if (allPoints.length > 0) {
                    const bounds = L.latLngBounds(allPoints);
                    map.fitBounds(bounds, { padding: [50, 50] });
                }

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loading').textContent = 'エラー';
                alert('データの読み込みに失敗しました');
            }
        }

        // データを読み込む
        loadData();
    </script>
</body>
</html>
