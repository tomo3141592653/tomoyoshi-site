<style>
:root{
  --bg:#faf7f1; --paper:#ffffff; --ink:#26221c; --muted:#7a7264;
  --line:#e6dfd2; --accent:#c2502e; --link:#2b5b8c;
  --sans:"Hiragino Sans","Yu Gothic","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#191613; --paper:#211d19; --ink:#ece7dd; --muted:#9a917f;
    --line:#38322a; --accent:#e0784f; --link:#7aa8d8; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.9;
  -webkit-font-smoothing:antialiased}
a{color:var(--link);text-underline-offset:.18em}
a:hover{color:var(--accent)}
.page{max-width:760px;margin:0 auto;padding:0 20px 60px}
.site-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:22px 0 14px;border-bottom:2px solid var(--accent);margin-bottom:8px}
.site-head .logo{font-size:1.15rem;font-weight:800;text-decoration:none;color:var(--ink);letter-spacing:.02em}
.site-head .logo:hover{color:var(--accent)}
.site-head nav{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem}
.site-head nav a{text-decoration:none;color:var(--muted);font-weight:600}
.site-head nav a:hover,.site-head nav a.here{color:var(--accent)}
.crumbs{font-size:.8rem;color:var(--muted);margin:14px 0 0}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--accent);text-decoration:underline}
h1{font-size:clamp(1.5rem,4.5vw,2.1rem);line-height:1.5;margin:14px 0 6px;letter-spacing:.01em}
.article h2{font-size:1.25rem;margin:2.2em 0 .6em;padding-left:12px;border-left:4px solid var(--accent);line-height:1.5}
.article h3{font-size:1.05rem;margin:1.8em 0 .5em}
.article p{margin:0 0 1.1em}
.article img{max-width:100%;height:auto;border-radius:6px;border:1px solid var(--line)}
.article ul,.article ol{padding-left:1.5em}
.article li{margin:.25em 0}
.article table{border-collapse:collapse;max-width:100%;display:block;overflow-x:auto;margin:1em 0}
.article td,.article th{border:1px solid var(--line);padding:6px 10px;font-size:.92rem}
.article hr{border:none;border-top:1px solid var(--line);margin:2em 0}
.kids{list-style:none;padding:0;margin:20px 0}
.kids li{margin:0;border-bottom:1px solid var(--line)}
.kids a{display:block;padding:12px 4px;text-decoration:none;font-weight:600}
.kids a:hover{background:var(--paper)}
.kids .sub{display:block;font-size:.8rem;color:var(--muted);font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:26px 0}
.card{display:block;background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:20px 18px;text-decoration:none;color:var(--ink);transition:transform .12s, border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--accent);color:var(--ink)}
.card .emoji{font-size:1.6rem}
.card b{display:block;font-size:1.06rem;margin:6px 0 2px;color:var(--accent)}
.card span{font-size:.85rem;color:var(--muted);line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chips a{font-size:.82rem;padding:5px 12px;border:1px solid var(--line);border-radius:999px;
  text-decoration:none;background:var(--paper)}
.chips a:hover{border-color:var(--accent)}
.hero{padding:34px 0 8px}
.hero .name{font-size:clamp(2rem,7vw,3rem);font-weight:800;letter-spacing:.02em;line-height:1.3;margin:0}
.hero .name .ex{color:var(--accent)}
.hero .tag{color:var(--muted);margin:10px 0 0;font-size:1rem}
.h2line{font-size:1.15rem;margin:34px 0 4px;padding-left:12px;border-left:4px solid var(--accent)}
.diary-years{margin:20px 0}
.diary-years h2{font-size:1.1rem;margin:1.6em 0 .4em;color:var(--accent)}
.diary-months{display:flex;flex-wrap:wrap;gap:8px}
.diary-months a{padding:6px 13px;border:1px solid var(--line);border-radius:8px;
  text-decoration:none;font-size:.9rem;background:var(--paper);font-variant-numeric:tabular-nums}
.diary-months a:hover{border-color:var(--accent)}
.prevnext{display:flex;justify-content:space-between;gap:12px;margin:36px 0 0;font-size:.88rem}
.prevnext a{text-decoration:none}
footer.site-foot{margin-top:54px;padding-top:18px;border-top:1px solid var(--line);
  color:var(--muted);font-size:.82rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer.site-foot a{color:var(--muted)}
</style>
