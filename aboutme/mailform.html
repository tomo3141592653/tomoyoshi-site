<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mail form | 平田朋義</title>
<style>
:root{
  --bg:#fbfbfd; --ink:#1d1d1f; --muted:#6e6e73; --faint:#a1a1a6;
  --line:#d2d2d7; --blue:#0071e3; --blue-soft:#e8f0fe;
  --ease:cubic-bezier(.28,0,0,1);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic","Noto Sans JP","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000000; --ink:#f5f5f7; --muted:#98989d; --faint:#6e6e73;
    --line:#3d3d41; --blue:#2997ff; --blue-soft:#0f1f30; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-weight:300;line-height:1.76;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration-thickness:1px;text-underline-offset:.22em;
  transition:color .18s var(--ease)}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:2px}
b,strong,h1,h2,h3,h4{font-weight:600}
.page{max-width:840px;margin:0 auto;padding:0 24px 72px}

.site-head{display:flex;align-items:center;justify-content:space-between;gap:16px;
  flex-wrap:wrap;padding:18px 0;position:sticky;top:0;z-index:10;margin:0 -24px;
  padding-left:24px;padding-right:24px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px)}
.site-head .logo{font-weight:700;font-size:1.02rem;letter-spacing:.16em;
  text-decoration:none;color:var(--ink);transition:color .18s var(--ease)}
.site-head .logo:hover{color:var(--blue)}
.site-head nav{display:flex;gap:26px;flex-wrap:wrap;
  font-family:var(--mono);font-size:.72rem;letter-spacing:.18em}
.site-head nav a{text-decoration:none;color:var(--muted);padding:2px 0;
  border-bottom:1px solid transparent;transition:color .18s var(--ease),border-color .18s var(--ease)}
.site-head nav a:hover{color:var(--blue)}
.site-head nav a.here{color:var(--blue);border-bottom-color:var(--blue)}

.crumbs{font-family:var(--mono);font-size:.72rem;color:var(--faint);
  margin:26px 0 0;letter-spacing:.04em}
.crumbs a{color:var(--faint);text-decoration:none}
.crumbs a:hover{color:var(--blue);text-decoration:underline}

.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.22em;
  color:var(--blue);margin:34px 0 0}
h1{font-size:clamp(1.75rem,4.6vw,2.5rem);line-height:1.4;margin:8px 0 10px;
  font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.article h2{font-size:1.28rem;margin:2.4em 0 .7em;line-height:1.6;
  padding-bottom:.4em;border-bottom:1px solid var(--line);letter-spacing:-.005em}
.article h3{font-size:1.04rem;margin:2em 0 .5em}
.article p{margin:0 0 1.2em}
.article img{max-width:100%;height:auto;display:block;margin:1.4em 0;border-radius:12px}
.article ul,.article ol{padding-left:1.5em}
.article li{margin:.3em 0}
.article table{border-collapse:collapse;max-width:100%;display:block;overflow-x:auto;margin:1.2em 0}
.article td,.article th{border:1px solid var(--line);padding:6px 12px;font-size:.9rem}
.article hr{border:none;border-top:1px solid var(--line);margin:2.4em 0}

.kids{list-style:none;padding:0;margin:14px 0 0;border-top:1px solid var(--line)}
.kids li{margin:0;border-bottom:1px solid var(--line)}
.kids a{display:block;padding:13px 10px;margin:0 -10px;border-radius:10px;
  text-decoration:none;color:var(--ink);font-weight:400;
  transition:background .18s var(--ease),transform .18s var(--ease),color .18s var(--ease)}
.kids a:hover{color:var(--blue);background:var(--blue-soft);transform:translateX(4px)}
.kids .sub{display:block;font-size:.8rem;color:var(--muted)}
.kids-head{font-family:var(--mono);font-size:.72rem;letter-spacing:.22em;
  color:var(--faint);margin:3.2em 0 0}

/* ---------- index ---------- */
.hero{padding:64px 0 0;animation:rise .6s var(--ease) both}
.hero .name{font-size:clamp(2.6rem,9vw,4.6rem);font-weight:700;line-height:1.1;
  letter-spacing:-.02em;margin:0}
.hero .romaji{font-family:var(--mono);font-size:.78rem;letter-spacing:.34em;
  color:var(--muted);margin:14px 0 0}
.pi-line{font-family:var(--mono);font-size:.82rem;white-space:nowrap;overflow:hidden;
  color:var(--faint);margin:34px 0 0;letter-spacing:.1em;
  -webkit-mask-image:linear-gradient(90deg,#000 72%,transparent);
  mask-image:linear-gradient(90deg,#000 72%,transparent);
  animation:reveal 1.1s var(--ease) .15s both}
.pi-line b{color:var(--blue);font-weight:600}
.hero .tag{max-width:34em;color:var(--muted);margin:30px 0 0;font-size:.95rem}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes reveal{from{opacity:0;letter-spacing:.02em}to{opacity:1;letter-spacing:.1em}}

.index-list{margin:60px 0 0;border-top:1px solid var(--line)}
.index-list a{display:grid;grid-template-columns:7.5em 1fr auto;gap:6px 18px;
  align-items:baseline;padding:20px 12px;margin:0 -12px;border-radius:12px;
  border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);
  transition:background .18s var(--ease),transform .18s var(--ease)}
.index-list .key{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;color:var(--muted)}
.index-list .jp{font-size:1.18rem;font-weight:600}
.index-list .jp .desc{display:block;font-size:.82rem;font-weight:300;color:var(--muted)}
.index-list .n{font-family:var(--mono);font-size:.78rem;color:var(--faint);
  font-variant-numeric:tabular-nums}
.index-list a:hover{background:var(--blue-soft);transform:translateX(4px)}
.index-list a:hover .jp,.index-list a:hover .key{color:var(--blue)}
@media (max-width:560px){
  .index-list a{grid-template-columns:1fr auto}
  .index-list .key{grid-column:1 / -1}
}

.elsewhere{margin:58px 0 0}
.elsewhere-head{font-family:var(--mono);font-size:.72rem;letter-spacing:.22em;color:var(--faint)}
.elsewhere-links{display:flex;flex-wrap:wrap;gap:4px 26px;margin:10px 0 0;font-size:.88rem}
.elsewhere-links a{text-decoration:none;color:var(--muted);
  border-bottom:1px solid var(--line);padding-bottom:1px;
  transition:color .18s var(--ease),border-color .18s var(--ease)}
.elsewhere-links a:hover{color:var(--blue);border-bottom-color:var(--blue)}

/* ---------- diary archive ---------- */
.diary-years{margin:26px 0}
.diary-years h2{font-family:var(--mono);font-size:.85rem;letter-spacing:.18em;
  margin:2.4em 0 .6em;color:var(--muted);border:none;padding:0}
.diary-months{display:flex;flex-wrap:wrap;gap:8px}
.diary-months a{font-family:var(--mono);padding:7px 16px;border:1px solid var(--line);
  border-radius:980px;text-decoration:none;font-size:.82rem;color:var(--ink);
  font-variant-numeric:tabular-nums;transition:border-color .18s var(--ease),color .18s var(--ease),background .18s var(--ease)}
.diary-months a:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}

footer.site-foot{margin-top:88px;padding-top:20px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;color:var(--faint)}
footer.site-foot a{color:var(--faint);text-decoration:none;transition:color .18s var(--ease)}
footer.site-foot a:hover{color:var(--blue)}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
